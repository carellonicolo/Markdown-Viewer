# Compila l'app e pubblica la release della versione scritta in Sources/App/Info.plist,
# con MD-Viewer.dmg e MD-Viewer.zip e le novità prese da CHANGELOG.md.
# Si avvia in uno di questi modi:
#   - Actions → Release → Run workflow (il più semplice: crea da solo il tag "v<versione>");
#   - pubblicando una release o un tag "v<versione>" (es. v2.1).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Creare la release dal sito fa partire due eventi: le esecuzioni vanno una alla volta.
concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legge la versione dell'app
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Sources/App/Info.plist)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione $version in Sources/App/Info.plist"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Compila
        run: ./build.sh --zip --dmg

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MD-Viewer.dmg build/MD-Viewer.zip --clobber
            if [[ -z "$(gh release view "$TAG" --json body --jq .body)" ]]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" build/MD-Viewer.dmg build/MD-Viewer.zip --target "$GITHUB_SHA" \
              --title "MD Viewer $VERSION" --notes-file notes.md
          fi
